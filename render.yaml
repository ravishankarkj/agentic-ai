services:
  - type: web
    name: brain-box-with-ai
    env: python
    plan: starter
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run python -m app.main"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: render
      - key: LOG_LEVEL
        value: INFO
